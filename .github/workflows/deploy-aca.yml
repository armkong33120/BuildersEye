name: Build & Deploy to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/data/**'
      - '.github/workflows/deploy-aca.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/armkong33120/builderseye-backend:latest
  ACA_NAME: builderseye-backend
  ACA_RG: rg-builderseye

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push image ไป GHCR
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}
            ghcr.io/armkong33120/builderseye-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name ${{ env.ACA_NAME }} \
            --resource-group ${{ env.ACA_RG }} \
            --image ghcr.io/armkong33120/builderseye-backend:sha-${{ github.sha }}
