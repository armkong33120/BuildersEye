<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEURAL RAG — RAG assistant · org graph · live chat inspector</title>
<style>
  :root{
    --bg:#070a12; --panel:#0b101b; --line:#1c2740; --txt:#d8e1f0; --dim:#71809c; --faint:#46536e;
    --c0:#22d3ee; --c1:#4f8bff; --c2:#a78bfa; --c3:#e879f9; --co:#f472b6; --amber:#fbbf24;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:13px;overflow:hidden}
  .top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#090d16}
  .brand{font-weight:700;letter-spacing:.08em;color:var(--c0);font-size:13px;white-space:nowrap}
  .brand i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c0);margin-right:7px;box-shadow:0 0 8px var(--c0)}
  .top input{flex:1;max-width:420px;background:#0d1422;border:1px solid var(--line);border-radius:7px;color:var(--txt);padding:6px 10px;font-family:var(--mono);font-size:12px;outline:none}
  .top input:focus{border-color:var(--c0)}
  #chip{font-size:10px;color:var(--faint);border:1px solid var(--line);padding:3px 8px;border-radius:99px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{display:flex;height:calc(100vh - 43px)}
  #stage{flex:1;position:relative;min-width:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* node tooltip */
  #tip{position:absolute;z-index:10;background:#0a0f1c;border:1px solid var(--c0);border-radius:8px;padding:8px 10px;
       font-size:11px;max-width:300px;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.6)}
  #tip b{color:var(--txt);font-size:12px}
  #tip .m{color:var(--c0)}
  #tip .f{color:var(--amber);font-size:10px;margin-top:3px;word-break:break-all}
  #tip .d{color:var(--dim);margin-top:3px;line-height:1.5}
  #tip.hide{display:none}
  /* online users overlay */
  #online{position:absolute;top:10px;left:10px;z-index:9;background:rgba(9,13,22,.85);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;max-width:230px;pointer-events:none}
  #online .ol-h{color:var(--co);font-weight:700;letter-spacing:.05em;margin-bottom:5px}
  #online .ol-list{display:flex;flex-wrap:wrap;gap:4px}
  #online .ol{background:#0d1422;border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--c0);font-size:10px;cursor:default}
  #online .ol-none{color:var(--faint);font-size:10px}
  /* side panels */
  #side{width:376px;border-left:1px solid var(--line);background:#090d16;display:flex;flex-direction:column;overflow-y:auto}
  .pane{padding:12px;border-bottom:1px solid var(--line)}
  .pane-h{font-size:10px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;margin-bottom:8px;flex:1}
  .pane-h b{color:var(--co)}
  .pane-row{display:flex;align-items:center;gap:8px}
  .cnt{color:var(--c0)}
  .mini{background:#0d1422;border:1px solid var(--line);color:var(--faint);border-radius:6px;padding:2px 8px;font-family:var(--mono);font-size:9.5px;cursor:pointer}
  .mini:hover{color:var(--c0);border-color:var(--c0)}
  #credsStatus{font-size:10px;color:var(--amber);display:block;margin-bottom:6px;line-height:1.4;min-height:12px}
  #userSelect{width:100%;background:#0d1422;border:1px solid var(--line);border-radius:7px;color:var(--txt);padding:6px 8px;font-family:var(--mono);font-size:11px;margin-bottom:8px;outline:none}
  #userSelect:focus{border-color:var(--c0)}
  .chatrow{display:flex;gap:6px;margin-bottom:8px}
  #assistInput{flex:1;background:#0d1422;border:1px solid var(--line);border-radius:7px;color:var(--txt);padding:6px 9px;font-family:var(--mono);font-size:12px;outline:none;min-width:0}
  #assistInput:focus{border-color:var(--c0)}
  #assistSend{background:#0d1422;border:1px solid var(--c0);color:var(--c0);border-radius:7px;padding:6px 14px;font-family:var(--mono);font-size:12px;cursor:pointer;white-space:nowrap}
  #assistSend:hover{background:rgba(34,211,238,.12)}
  #assistSend:disabled{opacity:.45;cursor:wait}
  #assistOutput{background:#0d1422;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:11.5px;line-height:1.6;max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#c9d6ee;min-height:36px}
  #assistMeta{font-size:10px;color:var(--dim);margin-top:7px;line-height:1.5;word-break:break-all}
  #assistMeta b{color:var(--c0)}
  #traceList{list-style:none;padding:0;margin:0 0 2px;display:flex;flex-direction:column;gap:3px;max-height:240px;overflow:auto}
  #traceList li{font-size:11px;color:var(--dim);padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:#0d1422;display:flex;gap:8px;align-items:baseline}
  #traceList .ix{color:var(--faint);min-width:30px}
  #traceList .nd{color:var(--c0);font-weight:700;min-width:56px}
  #traceList .ms{color:var(--amber);min-width:58px}
  #traceList .nt{color:var(--txt);flex:1;text-align:right;word-break:break-word}
  #historyList{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px;max-height:360px;overflow:auto}
  #historyList li{font-size:10.5px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#0d1422;cursor:pointer}
  #historyList li:hover{border-color:var(--c0)}
  #historyList .hq{color:var(--txt);line-height:1.4}
  #historyList .hm{color:var(--faint);margin-top:2px;font-size:9.5px}
  #historyList .hn{color:var(--co);margin-top:2px;font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{color:var(--faint);font-size:10.5px;padding:4px 2px;list-style:none}
  ::-webkit-scrollbar{width:7px}::-webkit-scrollbar-thumb{background:#233047;border-radius:6px}
  /* admin gate overlay — content stays loaded underneath, never removed */
  #gate{position:fixed;inset:0;z-index:50;background:rgba(4,7,14,.93);display:flex;align-items:center;justify-content:center}
  #gate.hide{display:none}
  #gateBox{width:330px;background:#0b101b;border:1px solid var(--c0);border-radius:12px;padding:22px;box-shadow:0 0 44px rgba(34,211,238,.14)}
  #gateBox h1{font-size:13px;letter-spacing:.14em;color:var(--c0);margin-bottom:5px}
  #gateBox p{font-size:10.5px;color:var(--faint);margin-bottom:14px}
  #gateBox label{display:block;font-size:10px;color:var(--dim);margin:10px 0 4px;letter-spacing:.08em;text-transform:uppercase}
  #gateBox input{width:100%;background:#0d1422;border:1px solid var(--line);border-radius:7px;color:var(--txt);padding:8px 10px;font-family:var(--mono);font-size:12px;outline:none}
  #gateBox input:focus{border-color:var(--c0)}
  #gateErr{color:#f87171;font-size:11px;margin-top:9px;min-height:15px}
  #gateBtn{width:100%;margin-top:10px;background:transparent;border:1px solid var(--c0);color:var(--c0);border-radius:7px;padding:9px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;cursor:pointer}
  #gateBtn:hover{background:rgba(34,211,238,.12)}
</style>
</head>
<body>
  <div class="top">
    <span class="brand"><i></i>NEURAL RAG · INSPECTOR</span>
    <input id="q" value="วิศวกรคนไหนทำ OT เทปูนข้ามคืนบ้าง?" />
    <span id="chip"></span>
  </div>
  <main>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="tip" class="hide"></div>
      <div id="online"></div>
    </div>
    <aside id="side">
      <section class="pane">
        <h3 class="pane-h">RAG ASSISTANT <b>· live chat</b></h3>
        <span id="credsStatus"></span>
        <select id="userSelect"></select>
        <div class="chatrow">
          <input id="assistInput" placeholder="Ask as the selected user…" />
          <button id="assistSend">Send</button>
        </div>
        <div id="assistOutput">— no query yet —</div>
        <div id="assistMeta"></div>
      </section>
      <section class="pane">
        <h3 class="pane-h">TRACE · CONNECTION LOG</h3>
        <ol id="traceList"></ol>
      </section>
      <section class="pane">
        <div class="pane-row">
          <h3 class="pane-h">HISTORY <span class="cnt" id="histCnt"></span></h3>
          <button id="histClear" class="mini">clear</button>
        </div>
        <ul id="historyList"></ul>
      </section>
    </aside>
  </main>
  <div id="gate">
    <div id="gateBox">
      <h1>🔒 NEURAL RAG · ADMIN GATE</h1>
      <p>debug inspector — root access only</p>
      <label>username</label><input id="gateUser" autocomplete="off" />
      <label>password</label><input id="gatePass" type="password" autocomplete="off" />
      <div id="gateErr"></div>
      <button id="gateBtn">UNLOCK</button>
    </div>
  </div>
<script>
// ════════════════════════════════════════════════════════════════════════════
// NEURAL RAG · RAG Assistant / Org graph retrieval / online live chat inspector
// Shows the TRUTH of which of the 19 pipeline nodes actually ran per query,
// plus a per-query connection log (trace) and history.
// Backend contract verified 2026-08-18 via curl:
//   GET  /api/preview/credentials → 150 users [{username, role, name, jobTitle}]
//   POST /api/auth/login          → {accessToken, refreshToken, user}
//   POST /api/chat                → {query, answer, trace[], llmUsed, sqlUsed,
//                                    answerSource, matchersUsed, cached, ...}
//   GET  /api/debug/pipeline      → {query, answer, trace[], responseTimeMs, ...}
// ════════════════════════════════════════════════════════════════════════════

// ── TEST ACCOUNT PASSWORD ────────────────────────────────────────────────────
// Demo/test feature: ALL seeded accounts (150) share this one known password.
// It matches TEST_ACCOUNT_PASSWORD on prod AND the local dev seed, so this
// inspector can auto-login as ANY selected user and run live RAG queries.
const TEST_PASSWORD = 'CEO@Landyi2026';

// ── เครือข่าย: 6 ชั้น · 19 โหนด = ขั้น pipeline จริง (audit 2026-08-11) ────────
const LAYERS = [
  { key:'input', color:'#22d3ee', nodes:[
    {id:'q',    label:'User Query',     file:'app.html · src/main.js', detail:'raw question text'},
    {id:'mem',  label:'Conversation Memory', file:'server/chatMemory.js', detail:'user message persisted + history turns'},
  ]},
  { key:'h1', color:'#4f8bff', ms:120, nodes:[
    {id:'pol',   label:'Policy Check',   file:'server/policy.js', detail:'checkQueryPolicy() · role-block regex · STOP on Blocked'},
    {id:'sql',   label:'SQL Detect',     file:'server/chatController.js', detail:'needsSqlAnalytics regex flag (avg/compare/salary/turnover…)'},
    {id:'pron',  label:'Pronoun Resolve',file:'server/pronounResolver.js', detail:'history-based EMP/name enrichment'},
    {id:'cache', label:'Response Cache', file:'server/responseCache.js', detail:'cacheGet/cacheSet · TTL 15 min · LLM-on only · STOP on hit'},
    {id:'sem',   label:'Semantic Intent',file:'server/semanticParser.js', detail:'LLM JSON intent · STOP on clarification'},
    {id:'scope', label:'RBAC Scope',     file:'server/chatController.js', detail:'buildScopeCodesForRole() · null(CEO/HR) | Set<code>'},
    {id:'sheet', label:'Sheet Mentions', file:'server/sheetAliases.js', detail:'bilingual alias → sheet set'},
  ]},
  { key:'h2', color:'#a78bfa', ms:87, nodes:[
    {id:'kw',   label:'Keyword Search', file:'server/searchIndex.js', detail:'search() · 7 matchers + mergeAndRank → top 15'},
    {id:'rbac', label:'RBAC Re-check',  file:'server/policy.js', detail:'resolveScope()/applyFieldRedaction() · per-hit scope + redaction'},
    {id:'sqle', label:'SQL Engine',     file:'server/sqlEngine.js', detail:'generateAndRunSQL() · CONDITIONAL: SQL route, scoped table'},
    {id:'emb',  label:'Embed',          file:'server/localEmbedder.js', detail:'embedOne() · CONDITIONAL: vector route, Xenova/multilingual-e5-small 384d'},
    {id:'vec',  label:'Vector Search',  file:'server/vectorStore.js', detail:'searchVectors() · CONDITIONAL: k=15, min 0.85, sheetBoost 1.10'},
  ]},
  { key:'h3', color:'#c084fc', ms:32, nodes:[
    {id:'ctx',  label:'Context Build',  file:'server/anonymizer.js', detail:'buildContext() · chunks → LLM context ≤8000 chars'},
    {id:'anom', label:'Anonymize / De-anonymize', file:'server/anonymizer.js', detail:'anonymize()/deAnonymize() · Tier1→3 label mapping'},
  ]},
  { key:'h4', color:'#e879f9', ms:1200, nodes:[
    {id:'llm',  label:'LLM Generate',   file:'server/llmClient.js', detail:'generateAnswer() · CONDITIONAL: DeepSeek deepseek-v4-flash, max_tokens 500'},
    {id:'tpl',  label:'Template Fallback', file:'server/searchIndex.js', detail:'buildAnswer() · deterministic when no LLM / no branch won'},
  ]},
  { key:'out', color:'#f472b6', nodes:[
    {id:'out',  label:'Answer Enrich + Save', file:'server/chatController.js', detail:'PK/name highlight · chatMemory save · cacheSet · latestPipeline'},
  ]},
];
// ลำดับรัน = เรียงตามชั้น (h1..out)
const STAGES = LAYERS.filter(l=>l.ms).map(l=>l.key);
// ── engine ───────────────────────────────────────────────────────────────────
const cv=document.getElementById('cv'), st=document.getElementById('stage'),
      tip=document.getElementById('tip'), onlineEl=document.getElementById('online');
const $=id=>document.getElementById(id);
const nodes=new Map(), edges=[], parts=[];
let W=0,H=0,DPR=1, hover=null;

function layout(){
  const r=st.getBoundingClientRect(); W=Math.max(r.width,300); H=Math.max(r.height,200);
  DPR=Math.min(devicePixelRatio||1,2); cv.width=W*DPR; cv.height=H*DPR;
  const pad=46, nC=LAYERS.length, colW=(W-pad*2)/nC;
  nodes.clear();
  LAYERS.forEach((ly,ci)=>{
    const x=pad+colW*ci+colW/2, n=ly.nodes.length;
    const gap=Math.max(34,Math.min(52,(H-120)/Math.max(n,1))), y0=(H-(n-1)*gap)/2;
    ly.nodes.forEach((nd,ni)=>nodes.set(nd.id,{x,y:y0+ni*gap,r:15,nd,ly,st:0}));
  });
  edges.length=0;
  for(let i=0;i<LAYERS.length-1;i++){
    for(const a of LAYERS[i].nodes) for(const b of LAYERS[i+1].nodes){
      const h=[...(a.id+b.id)].reduce((s,c)=>s+c.charCodeAt(0),0);
      if(h%100/100<0.9) edges.push([a.id,b.id]);
    }
  }
}
function draw(){
  const c=cv.getContext('2d'); c.setTransform(DPR,0,0,DPR,0,0); c.clearRect(0,0,W,H);
  // edges
  for(const [a,b] of edges){
    const A=nodes.get(a),B=nodes.get(b); const act=A.st>0||B.st>0;
    c.strokeStyle=act?'rgba(90,140,255,.30)':'rgba(60,80,130,.12)';
    c.lineWidth=act?1.2:.6; c.beginPath(); c.moveTo(A.x,A.y);
    const mx=(A.x+B.x)/2; c.bezierCurveTo(mx,A.y,mx,B.y,B.x,B.y); c.stroke();
  }
  // particles
  for(const p of parts){
    p.t+=0.016/p.dur; const e=p.t<.5?2*p.t*p.t:1-Math.pow(-2*p.t+2,2)/2;
    p.x=p.sx+(p.tx-p.sx)*e; p.y=p.sy+(p.ty-p.sy)*e;
    c.shadowColor=p.c; c.shadowBlur=8; c.fillStyle=p.c; c.beginPath();
    c.arc(p.x,p.y,2.2,0,7); c.fill(); c.shadowBlur=0;
  }
  for(let i=parts.length-1;i>=0;i--) if(parts[i].t>=1) parts.splice(i,1);
  // nodes
  for(const [id,n] of nodes){
    const col=n.ly.color, glow=n.st===2?col:n.st===1?'#fff':col;
    c.shadowColor=glow; c.shadowBlur=n.st===1?24:n.st===2?14:hover===id?16:9;
    c.fillStyle=n.st===1?'#fff':n.st===2?col:col; c.globalAlpha=n.st===0?.55:1;
    c.beginPath(); c.arc(n.x,n.y,n.r,0,7); c.fill(); c.globalAlpha=1; c.shadowBlur=0;
    if(hover===id){c.strokeStyle=col;c.lineWidth=1.4;c.beginPath();c.arc(n.x,n.y,n.r+3,0,7);c.stroke();}
    c.fillStyle='rgba(220,230,255,.9)'; c.font='600 10px ui-monospace,monospace'; c.textAlign='center';
    c.fillText(n.nd.label.length>13?n.nd.label.slice(0,12)+'…':n.nd.label, n.x, n.y+n.r+13);
  }
  requestAnimationFrame(draw);
}
function burst(from,to){
  const A=nodes.get(from),T=nodes.get(to); if(!A||!T)return;
  parts.push({sx:A.x,sy:A.y,tx:T.x,ty:T.y,x:A.x,y:A.y,t:0,dur:.5+Math.random()*.4,c:nodes.get(to).ly.color});
}

// ── render (อัปเดต query) ───────────────────────────────────────────────────
function render(d){ $('q').value=d.q; }
// ── run(d): node TRUTH ───────────────────────────────────────────────────────
// When d.trace (ordered [{node, ms, note}]) is present, ONLY the nodes in the
// trace light up, in trace order, dwelling on each entry's ms (clamped to
// 50..1100ms so a slow sem/llm doesn't freeze the demo). Nodes NOT in the trace
// stay dimmed (st=0). Without a trace (first load) fall back to the layer sweep.
// A runToken cancels any previous in-flight animation so a newer pipeline event
// always wins (each event re-renders the TRUTH).
let runToken=0;
function run(d){
  const tok=++runToken;
  for(const n of nodes.values())n.st=0;
  parts.length=0;
  if(d&&d.q){ $('q').value=d.q; render(d); }
  const trace=(d&&Array.isArray(d.trace))?d.trace:null;
  (async()=>{
    if(trace&&trace.length){
      let prevId=null;
      for(const t of trace){
        if(tok!==runToken)return;
        const n=nodes.get(t.node); if(!n)continue;
        n.st=1;
        if(prevId&&nodes.get(prevId))burst(prevId,t.node);
        const dwell=Math.max(50,Math.min(1100,Number(t.ms)||80));
        await wait(dwell);
        if(tok!==runToken)return;
        n.st=2;
        prevId=t.node;
      }
    }else{
      for(const nd of LAYERS[0].nodes){ if(tok!==runToken)return; nodes.get(nd.id).st=1; await wait(90); nodes.get(nd.id).st=2; }
      for(const key of STAGES){
        const ly=LAYERS.find(l=>l.key===key);
        for(const nd of ly.nodes){
          if(tok!==runToken)return;
          nodes.get(nd.id).st=1;
          const prev=LAYERS[LAYERS.indexOf(ly)-1];
          for(const p of prev.nodes) burst(p.id,nd.id);
          await wait(ly.ms/ly.nodes.length/4);
          if(tok!==runToken)return;
          nodes.get(nd.id).st=2;
        }
      }
      for(const nd of LAYERS[LAYERS.length-1].nodes){ if(tok!==runToken)return; nodes.get(nd.id).st=1; await wait(90); nodes.get(nd.id).st=2; }
    }
  })();
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

// ── hover tooltip ───────────────────────────────────────────────────────────
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  let best=null,bd=20;
  for(const [id,n] of nodes){const d=Math.hypot(n.x-x,n.y-y); if(d<bd){bd=d;best=id;}}
  hover=best;
  if(best){const n=nodes.get(best);
    tip.innerHTML=`<b>${n.nd.label}</b> <span class="m">${n.ly.ms?n.ly.ms+'ms':''}</span>`+
      (n.nd.file?`<div class="f">${n.nd.file}</div>`:'')+
      `<div class="d">${n.nd.detail}</div>`;
    tip.style.left=Math.min(n.x+22,W-330)+'px'; tip.style.top=Math.max(4,n.y-30)+'px';
    tip.classList.remove('hide');
  }else tip.classList.add('hide');
});
cv.addEventListener('mouseleave',()=>{hover=null;tip.classList.add('hide');});

// ── controls ────────────────────────────────────────────────────────────────
window.addEventListener('resize',layout);

// ── backend resolution ──────────────────────────────────────────────────────
// ?backend=<url> query param > localhost dev default > production backend
const PROD_BACKEND = 'https://builderseye-backend.wittybush-d59275bd.southeastasia.azurecontainerapps.io';
const BACKEND = new URLSearchParams(location.search).get('backend')
  || ((location.hostname==='localhost'||location.hostname==='127.0.0.1') ? 'http://localhost:5199' : PROD_BACKEND);

// ── helpers ─────────────────────────────────────────────────────────────────
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
// ── trace / connection log ──────────────────────────────────────────────────
function traceEntries(d){ return (d&&Array.isArray(d.trace))?d.trace:[]; }
function renderTrace(trace){
  const el=$('traceList'); if(!el)return;
  el.innerHTML='';
  if(!trace.length){ el.innerHTML='<li class="empty">— no trace yet —</li>'; return; }
  trace.forEach((t,i)=>{
    const li=document.createElement('li');
    li.innerHTML='<span class="ix">#'+String(i+1).padStart(2,'0')+'</span>'+
      '<span class="nd">'+escapeHtml(t.node)+'</span>'+
      '<span class="ms">+'+(Number(t.ms)||0)+'ms</span>'+
      '<span class="nt">'+escapeHtml(t.note||'')+'</span>';
    el.appendChild(li);
  });
}
let currentUserInfo=null;
function selectedUsername(){ const s=$('userSelect'); return s?s.value:''; }
function updateCurrentUser(){
  const s=$('userSelect'); if(!s)return;
  const opt=s.options[s.selectedIndex];
  currentUserInfo=opt?{username:opt.value,role:(opt.dataset.role||''),label:opt.textContent}:null;
}
function whoLabel(d){
  const u=d.viewer||selectedUsername()||'—';
  const known=currentUserInfo&&currentUserInfo.username===u;
  return known?u+' ('+currentUserInfo.role+')':u;
}
function metaLine(d){
  const sec=d.responseTimeMs!=null?(d.responseTimeMs/1000).toFixed(1)+'s':'—';
  const bits=['as '+whoLabel(d),sec];
  if(d.answerSource)bits.push('answerSource='+d.answerSource);
  if(d.sqlUsed)bits.push('sqlUsed');
  if(d.llmUsed)bits.push('llmUsed');
  if(d.cached)bits.push('cached');
  return bits.join(' · ');
}
function renderAnswer(d){
  const out=$('assistOutput'), meta=$('assistMeta');
  if(!out)return;
  out.textContent=d.answer||'(no answer)';
  if(meta)meta.innerHTML='<b>'+escapeHtml(metaLine(d))+'</b>';
}

// ── history (localStorage, cap 50, newest first) ────────────────────────────
const HISTORY_KEY='be_debug_history';
function loadHistory(){ try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');}catch(e){return [];} }
function saveHistory(h){ try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(0,50))); }catch(e){} }
function pushHistory(d){
  const h=loadHistory();
  h.unshift({
    query:d.query,
    at:d.at||new Date().toISOString(),
    trace:traceEntries(d),
    answer:(d.answer||'').slice(0,400),
    answerSource:d.answerSource||'',
    viewer:d.viewer||selectedUsername(),
    responseTimeMs:d.responseTimeMs||0,
    sqlUsed:!!d.sqlUsed, llmUsed:!!d.llmUsed,
  });
  saveHistory(h);
  renderHistory();
}
function renderHistory(){
  const el=$('historyList'); if(!el)return;
  const h=loadHistory();
  el.innerHTML='';
  const cnt=$('histCnt'); if(cnt)cnt.textContent=h.length+'/50';
  if(!h.length){ el.innerHTML='<li class="empty">— no history yet —</li>'; return; }
  h.forEach(e=>{
    const li=document.createElement('li');
    const tm=new Date(e.at).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    li.innerHTML='<div class="hq">'+escapeHtml(e.query)+'</div>'+
      '<div class="hm">'+tm+' · '+escapeHtml(e.viewer||'?')+' · '+e.trace.length+' nodes · '+escapeHtml(e.answerSource||'')+'</div>'+
      '<div class="hn">'+escapeHtml(e.trace.map(x=>x.node).join('→'))+'</div>';
    li.addEventListener('click',()=>presentPipeline(e,{record:false}));
    el.appendChild(li);
  });
}
let lastQuery=null;
// Render one pipeline event everywhere (trace list + answer + history + canvas)
function presentPipeline(d,{record=true}={}){
  if(!d||!d.query)return;
  lastQuery=d.query;
  renderTrace(traceEntries(d));
  renderAnswer(d);
  if(record)pushHistory(d);
  run({ q:d.query, ans:d.answer||'', lat:d.responseTimeMs||0,
        chunks:(d.chunks||[]).map(c=>({s:c.s||0.5,t:c.t||''})), trace:traceEntries(d) });
}

// ── credentials dropdown (150 test accounts) ────────────────────────────────
async function loadCredentials(){
  const sel=$('userSelect'), status=$('credsStatus');
  try{
    const r=await fetch(BACKEND+'/api/preview/credentials',{cache:'no-store'});
    if(r.status===403){ status.textContent='⚠ credentials disabled (ENABLE_TEST_CREDS=off on backend)'; sel.innerHTML='<option value="">— creds unavailable —</option>'; return; }
    if(!r.ok){ status.textContent='⚠ credentials error HTTP '+r.status; return; }
    const arr=await r.json();
    if(!Array.isArray(arr)||!arr.length){ status.textContent='⚠ no credentials returned'; return; }
    arr.sort((a,b)=>a.username.localeCompare(b.username));
    sel.innerHTML=arr.map(u=>'<option value="'+escapeHtml(u.username)+'" data-role="'+escapeHtml(u.role||'')+'">'+
      escapeHtml(u.username)+' — '+escapeHtml(u.role||'')+' · '+escapeHtml(u.name||u.jobTitle||'')+'</option>').join('');
    if(arr.some(u=>u.username==='ceo')) sel.value='ceo';
    updateCurrentUser();
    status.textContent='✓ '+arr.length+' test accounts (ENABLE_TEST_CREDS)';
  }catch(e){ status.textContent='⚠ backend not reachable — '+BACKEND; }
}
// ── RAG assistant: auto-login + live chat ───────────────────────────────────
let currentToken=null, tokenUser=null;
async function loginAs(username){
  const r=await fetch(BACKEND+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username,password:TEST_PASSWORD})});
  if(!r.ok){ const t=await r.text().catch(()=>''); throw new Error('login '+r.status+' '+t.slice(0,140)); }
  const d=await r.json();
  if(!d.accessToken)throw new Error('login: no accessToken in response');
  currentToken=d.accessToken; tokenUser=username;   // page-local only — never touches localStorage be_access
  return d;
}
async function sendChat(){
  const input=$('assistInput'), out=$('assistOutput'), meta=$('assistMeta'), btn=$('assistSend');
  const query=input.value.trim();
  if(!query){ out.textContent='✗ enter a query first'; return; }
  const username=selectedUsername();
  if(!username){ out.textContent='✗ no user selected'; return; }
  btn.disabled=true; out.textContent='thinking…'; if(meta)meta.textContent='';
  try{
    if(!currentToken||tokenUser!==username) await loginAs(username);
    const convId=(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():('c-'+Date.now()+'-'+Math.random().toString(16).slice(2));
    const r=await fetch(BACKEND+'/api/chat',{method:'POST',
      headers:{'Authorization':'Bearer '+currentToken,'Content-Type':'application/json'},
      body:JSON.stringify({query,conversationId:convId,viewer:username})});
    if(!r.ok){ const t=await r.text().catch(()=>''); throw new Error('chat HTTP '+r.status+' '+t.slice(0,140)); }
    const d=await r.json();
    if(!d.viewer)d.viewer=username;
    presentPipeline(d,{record:true});   // answer + trace + history + canvas truth
  }catch(e){
    out.textContent='✗ '+e.message; if(meta)meta.textContent='';
  }finally{ btn.disabled=false; }
}

// ── live mode: poll the RAG backend for real pipeline data (auto-animate) ───
async function pollPipeline(){
  try{
    const r=await fetch(BACKEND+'/api/debug/pipeline',{cache:'no-store'});
    if(!r.ok)return;
    const d=await r.json();
    if(d.query && d.query!==lastQuery) presentPipeline(d,{record:true});
  }catch(e){/* backend not up yet */}
}
setInterval(pollPipeline, 2000);

// ── online users (who is logged in now) ─────────────────────────────────────
async function pollOnline(){
  try{
    const r=await fetch(BACKEND+'/api/debug/online',{cache:'no-store'});
    if(!r.ok)return;
    const d=await r.json();
    const list=(d.users||[]).map(u=>
      `<span class="ol" title="${u.name} · ${u.role} · ${u.dept||''}">${u.username}</span>`).join('');
    onlineEl.innerHTML=`<div class="ol-h">● ออนไลน์ ${d.count||0}</div><div class="ol-list">${list||'<span class="ol-none">—</span>'}</div>`;
  }catch(e){ onlineEl.innerHTML='<div class="ol-h">● ออนไลน์</div>'; }
}
setInterval(pollOnline, 3000);

// ── admin gate (root / 1234) — overlay only, scripts keep running ───────────
const gate=$('gate');
if(sessionStorage.getItem('be_debug_admin')==='1') gate.classList.add('hide');
$('gateBtn').addEventListener('click',()=>{
  const u=$('gateUser').value.trim(), p=$('gatePass').value;
  if(u==='root'&&p==='1234'){ sessionStorage.setItem('be_debug_admin','1'); gate.classList.add('hide'); $('gateErr').textContent=''; }
  else $('gateErr').textContent='✗ wrong credentials — root / 1234';
});
$('gatePass').addEventListener('keydown',e=>{ if(e.key==='Enter')$('gateBtn').click(); });

// ── widget wiring ───────────────────────────────────────────────────────────
$('userSelect').addEventListener('change',updateCurrentUser);
$('assistSend').addEventListener('click',sendChat);
$('assistInput').addEventListener('keydown',e=>{ if(e.key==='Enter')sendChat(); });
$('histClear').addEventListener('click',()=>{ localStorage.removeItem(HISTORY_KEY); renderHistory(); });

const chip=$('chip'); if(chip)chip.textContent='backend · '+BACKEND;

// ── init ────────────────────────────────────────────────────────────────────
layout(); draw();
loadCredentials();
renderTrace([]); renderHistory();
pollPipeline(); pollOnline();
</script>
