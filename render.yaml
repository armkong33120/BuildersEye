# Render Blueprint — BuildersEye RAG backend
# Deploy via: https://render.com (New → Blueprint) or link this repo
services:
  - type: web
    name: builderseye-backend
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: LLM_API_KEY
        sync: false   # set manually in Render dashboard (DeepSeek API key — never commit real key)
      - key: LLM_BASE_URL
        value: https://api.deepseek.com    # ← PRIMARY: DeepSeek API (use this for production)
        # For local GPU (Colab Ollama), override in Render Dashboard manually:
        #   LLM_BASE_URL = https://<tunnel>.trycloudflare.com/v1
        #   LLM_MODEL = qwen2.5:7b
      - key: LLM_MODEL
        value: deepseek-chat
      - key: LLM_SKIP
        value: "false"
      - key: HR_DATA_DIR
        value: /opt/render/project/src/src/data/hr_onedrive_demo
      - key: CORS_ORIGINS
        value: http://localhost:5174,http://localhost:5173,https://builders-eye.vercel.app
      - key: VECTOR_INDEX_DISABLED
        value: "true"   # Render free tier = 512MB RAM; disable memory-heavy vector index
      - key: JWT_SECRET
        sync: false     # REQUIRED for JWT auth (M1). Set manually in Render dashboard — never commit.
      - key: ACCESS_TOKEN_TTL
        value: "30m"    # JWT access token lifetime
      - key: ENABLE_TEST_CREDS
        value: "true"   # M4: expose /api/preview/credentials for the demo preview page. Set "false" in real prod.