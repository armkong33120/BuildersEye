# Render Blueprint — BuildersEye RAG backend & frontend
services:
  - type: web
    name: builderseye-backend
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_MODEL
        value: deepseek-chat
      - key: LLM_SKIP
        value: "false"
      - key: CORS_ORIGINS
        value: http://localhost:5174,https://builders-eye.vercel.app,https://builderseye-frontend.onrender.com
      - key: VECTOR_INDEX_DISABLED
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: ACCESS_TOKEN_TTL
        value: "30m"
      - key: ENABLE_TEST_CREDS
        value: "true"
      - key: TEST_ACCOUNT_PASSWORD
        sync: false

  - type: web
    name: builderseye-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://builderseye-backend.onrender.com